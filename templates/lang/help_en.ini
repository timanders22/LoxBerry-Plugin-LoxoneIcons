; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() (LoxBerry::Web respectively) derives the name of this file
; from the name of the help file and looks for it in templates/lang/ - not
; next to the help file. Every value is wrapped in double quotes and contains
; none itself; markup stays raw.

[HILFE]
K01 = "LoxoneIcons"
K02 = "Downloads the icons of the Loxone configurator for the <b>Touch Pure Flex</b> from the public Loxone website and offers them as a ready-made archive — the filled and the outlined variant, every icon as a 96×96 pixel image in white."
K03 = "What is in the archive"
K04 = "All icons from <span class='sm-mono'>configurator.loxone.com</span>, filled and outlined."
K05 = "Every icon as a PNG at 96×96 pixels, white — the format the Touch Pure Flex expects."
K06 = "A set of <b>weather icons</b> as SVG and as PNG in seven colour variants."
K07 = "A handful of mixed icons: waste bins, lawn mower, vacuum robot and others."
K08 = "How to proceed"
K09 = "On the plugin's page, start the download and then fetch <span class='sm-mono'>loxone_icons.zip</span>. The icons can then be used in your Loxone project."
K10 = "If the download fails"
K11 = "The icons live on a public Loxone page. Without internet access nothing works, and if Loxone rebuilds the page the download finds nothing any more — the log then names the address that no longer answers."
K12 = "Origin"
K13 = "The icons come from Loxone and are only downloaded and converted here, not shipped. Their use is subject to Loxone's terms."
