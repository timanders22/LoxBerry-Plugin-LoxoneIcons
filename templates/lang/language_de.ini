SICH_ERKLAERUNG = "Gedacht für den Umzug auf einen anderen LoxBerry. Die einzige Einstellung dieses Plugins ist das Aktionstoken, aus dem das Merkmal der Formulare abgeleitet wird. Die heruntergeladenen Symbole gehören nicht zur Sicherung – sie werden auf dem neuen Gerät neu geholt."
SICH_WARNUNG = "Die Sicherungsdatei enthält das Aktionstoken dieser Anlage. Behandeln Sie sie wie ein Passwort: nicht in ein Forum stellen und nicht an einen Fehlerbericht hängen. Nach dem Zurückspielen müssen Seiten, die in anderen Fenstern offen sind, neu geladen werden."
