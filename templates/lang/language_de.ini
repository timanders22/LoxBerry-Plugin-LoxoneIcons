K_ALLES_NEU = "Alles löschen und neu laden"
ALLES_HILFE = "<i>Fehlendes nachladen</i> holt nur, was fehlt oder unvollständig ist, und lässt Vorhandenes stehen. <i>Alles löschen und neu laden</i> löscht zuerst den ganzen Ordner <span class='sm-mono'>loxone_icons</span> samt Archiv und wirkt nur mit dem Haken daneben. Die Wetter- und die gemischten Symbole bleiben in beiden Fällen unangetastet."
