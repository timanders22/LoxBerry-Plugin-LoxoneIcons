KACHEL_LETZTER = "Ende des letzten Laufs"
ABRUF_HILFE = "Ein Abruf läuft im Hintergrund weiter, auch wenn Sie die Seite verlassen. Der vollständige Satz sind 1102 Abrufe und dauerte auf einem Raspberry Pi 4 etwa 90 Sekunden; das Umwandeln in PNG kommt hinzu."
