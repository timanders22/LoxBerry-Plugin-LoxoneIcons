[EINST]
H_ARCHIVE = "Archive"
WAS = "Das Plugin holt die Symbole des Loxone-Konfigurators für den Touch Pure Flex von der öffentlichen Seite <span class='sm-mono'>configurator.loxone.com</span>, wandelt sie in PNG um und legt alles als Archiv bereit. Die Loxone-Symbole liegen nicht im Paket – sie gehören Loxone und werden auf diesem LoxBerry geholt. Ihre Verwendung richtet sich nach den Bedingungen von Loxone."
