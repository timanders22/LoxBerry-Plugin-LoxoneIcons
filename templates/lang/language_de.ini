[LOX]
H = "Einbindung in Loxone"
S1 = "<b>Weg:</b> Dieses Plugin liefert keine Werte an den Miniserver – kein MQTT, kein UDP, keine virtuellen Eingänge. Deshalb gibt es hier weder ein Abonnement noch eine Baustein-Liste oder eine Importvorlage. Das Plugin holt Symbole und stellt sie als Archiv bereit."
S2 = "<b>Archiv holen:</b> Im Reiter <i>Einstellungen</i> den Abruf starten und danach <span class='sm-mono'>loxone_icons.zip</span> herunterladen."
S3 = "<b>Inhalt der Archive nach dem Entpacken:</b>"
SP_ORDNER = "Ordner"
SP_INHALT = "Inhalt"
SVG_FILLED = "Loxone-Symbole, gefüllte Ausführung, SVG wie von Loxone geliefert"
SVG_OUTLINED = "Loxone-Symbole, umrissene Ausführung, SVG wie von Loxone geliefert"
PNG_FILLED = "dieselben Symbole als PNG, 96 × 96 Pixel, weiß"
PNG_OUTLINED = "dieselben Symbole als PNG, 96 × 96 Pixel, weiß"
WETTER = "21 Wettersymbole als SVG, als PNG in den Farbvarianten Color, Dark, Flat, Green, Light, Realistic und Silver"
GEMISCHT = "10 Symbole als SVG: sieben Mülltonnen, Rasenroboter, Saugroboter, Pool"
S4 = "<b>In Loxone Config verwenden:</b> Bis Fassung 1.0.1 baute dieses Plugin eine <span class='sm-mono'>IconLibrary.zip</span> und spielte sie per FTP auf den Miniserver. Nach der Beschreibung von Fassung 2.0.0 trägt dieser Weg ab Loxone Config 17 nicht mehr, und er wurde entfernt. Wie Loxone Config eigene Symbole übernimmt, beschreibt die Dokumentation von Loxone. Dieses Plugin verändert weder die Projektdatei noch den Miniserver. <i>(Der Menüweg in Loxone Config 17 ist nicht am Gerät erprobt.)</i>"
S5 = "<b>Gegenprobe:</b> Der Reiter <i>Test</i> nennt, wie viele Symbole vorliegen und welche Loxone beim letzten Lauf nicht geliefert hat."

[TEST]
H = "Selbstprüfung"
