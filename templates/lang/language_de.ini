; LoxoneIcons NG - Sprachdatei Deutsch. Von Hand gepflegt, kein Erzeuger.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine;
; Attribute in Auszeichnung einfach quotieren. Umlaute als UTF-8-Zeichen.

