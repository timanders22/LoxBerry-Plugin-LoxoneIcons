; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() beziehungsweise LoxBerry::Web leitet den Namen dieser
; Datei aus dem Namen der Hilfedatei ab und sucht sie in templates/lang/ -
; nicht neben der Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen
; und enthaelt selbst keine; Auszeichnung bleibt roh.

[HILFE]
K01 = "LoxoneIcons"
K02 = "Holt die Symbole des Loxone-Konfigurators für den <b>Touch Pure Flex</b> von der öffentlichen Loxone-Seite und legt sie als fertiges Archiv zum Herunterladen bereit — gefüllte und umrissene Ausführung, jedes Symbol als 96×96-Pixel-Bild in Weiß."
K03 = "Was im Archiv liegt"
K04 = "Alle Symbole von <span class='sm-mono'>configurator.loxone.com</span>, gefüllt und umrissen."
K05 = "Jedes Symbol als PNG in 96×96 Pixeln, weiß — das Format, das der Touch Pure Flex erwartet."
K06 = "Ein Satz <b>Wettersymbole</b> als SVG und als PNG in sieben Farbvarianten."
K07 = "Einige gemischte Symbole: Mülltonnen, Rasenmäher, Saugroboter und weitere."
K08 = "So gehen Sie vor"
K09 = "Auf der Seite des Plugins den Abruf starten und danach <span class='sm-mono'>loxone_icons.zip</span> herunterladen. Die Symbole lassen sich anschließend im Loxone-Projekt verwenden."
K10 = "Wenn der Abruf scheitert"
K11 = "Die Symbole liegen auf einer öffentlichen Loxone-Seite. Ohne Internetzugang geht nichts, und wenn Loxone die Seite umbaut, findet der Abruf nichts mehr — das Protokoll nennt dann die Adresse, die nicht mehr antwortet."
K12 = "Herkunft"
K13 = "Die Symbole stammen von Loxone und werden hier nur geholt und umgewandelt, nicht mitgeliefert. Ihre Verwendung richtet sich nach den Bedingungen von Loxone."
