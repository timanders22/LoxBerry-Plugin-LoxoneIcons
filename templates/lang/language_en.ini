K_NACHLADEN = "Fetch what is missing"
HAKEN_ALLES = "Yes, delete all Loxone icons fetched so far"
K_ALLES_NEU = "Delete everything and download again"
ALLES_HILFE = "<i>Fetch what is missing</i> only fetches what is missing or incomplete and keeps everything else. <i>Delete everything and download again</i> first deletes the whole folder <span class='sm-mono'>loxone_icons</span> including the archive, and only works with the tick next to it. The weather and mixed icons are not touched in either case."
H_SICHERUNG = "Back up and restore settings"
SICH_ERKLAERUNG = "Meant for moving to another LoxBerry. The only setting of this plugin is the action token from which the mark of the forms is derived. The downloaded icons are not part of the backup – they are fetched again on the new device."
SICH_WARNUNG = "The backup file contains the action token of this installation. Treat it like a password: do not post it in a forum and do not attach it to a bug report. After restoring, pages open in other windows must be reloaded."
