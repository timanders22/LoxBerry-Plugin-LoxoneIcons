[EINST]
H_ARCHIVE = "Archives"
WAS = "The plugin fetches the icons of Loxone's Touch Pure Flex configurator from the public site <span class='sm-mono'>configurator.loxone.com</span>, converts them to PNG and offers everything as an archive. The Loxone icons are not part of the package – they belong to Loxone and are fetched on this LoxBerry. Their use is subject to Loxone's terms."
