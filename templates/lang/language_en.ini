[LOX]
H = "Loxone integration"
S1 = "<b>Path:</b> this plugin sends no values to the Miniserver – no MQTT, no UDP, no virtual inputs. There is therefore no subscription, no block list and no import template. The plugin fetches icons and offers them as an archive."
S2 = "<b>Get the archive:</b> start the download in the <i>Settings</i> tab, then download <span class='sm-mono'>loxone_icons.zip</span>."
S3 = "<b>Contents of the archives after unpacking:</b>"
SP_ORDNER = "Folder"
SP_INHALT = "Contents"
SVG_FILLED = "Loxone icons, filled variant, SVG as delivered by Loxone"
SVG_OUTLINED = "Loxone icons, outlined variant, SVG as delivered by Loxone"
PNG_FILLED = "the same icons as PNG, 96 × 96 pixels, white"
PNG_OUTLINED = "the same icons as PNG, 96 × 96 pixels, white"
WETTER = "21 weather icons as SVG, as PNG in the colour variants Color, Dark, Flat, Green, Light, Realistic and Silver"
GEMISCHT = "10 icons as SVG: seven waste bins, lawn robot, vacuum robot, pool"
S4 = "<b>Using them in Loxone Config:</b> up to version 1.0.1 this plugin built an <span class='sm-mono'>IconLibrary.zip</span> and uploaded it to the Miniserver via FTP. According to the description of version 2.0.0 this no longer works from Loxone Config 17 on, and it was removed. How Loxone Config takes over custom icons is described in Loxone's documentation. This plugin changes neither the project file nor the Miniserver. <i>(The menu path in Loxone Config 17 has not been tried on a device.)</i>"
S5 = "<b>Cross-check:</b> the <i>Test</i> tab shows how many icons are present and which ones Loxone did not deliver during the last run."

