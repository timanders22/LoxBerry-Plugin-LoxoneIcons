[DOWNLOAD]
HINT_1="This plugin downloads all icons from <a href='https://configurator.loxone.com' target='_blank'>Loxone's Touch Pure Flex Configurator</a> and creates a ZIP archive which you can download from here. A set of weather icons and some mixed icons are included as well."
HINT_2="Note! All Loxone icons are (c) by Loxone! We do not include any of them in the plugin - they are downloaded from Loxone's public website during installation."
HINT_3="Use them in your Loxone projects, but respect the copyright and do not use them anywhere else."
COL_ARCHIVE="Archive"
COL_SIZE="Size"
COL_DATE="Created"
ARCHIVE_LOXONE="Loxone Touch Pure Flex icons (SVG and PNG, filled and outlined)"
ARCHIVE_WEATHER="Weather icons (SVG and PNG in seven colour variants)"
ARCHIVE_MIXED="Mixed icons (waste bins, lawn mower, vacuum robot and others)"
NOT_YET="Not there yet - please start the download."
BUTTON_DOWNLOAD="Download"
HINT_REFRESH="Loxone adds new icons from time to time. <i>Refresh icons</i> only fetches what is missing and finishes within seconds. <i>Download everything again</i> throws away what is there and starts over - on a Raspberry Pi 4 this takes about 90 seconds."
BUTTON_REFRESH="Refresh icons"
BUTTON_FORCE="Download everything again"
