    <rect x="294" y="213" width="52" height="52" rx="12" fill="#ffffff" />
    <path d="M 310 244 A 13 13 0 1 1 330 244" fill="none" stroke="#6dac20" stroke-width="3" stroke-linecap="round" />
    <line x1="320" y1="239" x2="325" y2="231" stroke="#6dac20" stroke-width="2.5" stroke-linecap="round" />

    <!-- Flanking Left Symbol: Cloud Download -->
    <g transform="translate(112, 175)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <path d="M -8 2 C -8 -3 -4 -6 1 -6 C 5 -6 8 -3 9 0 C 11 0 13 2 12 5 C 11 8 8 9 5 9 L -5 9 C -8 9 -10 6 -8 2 Z" fill="#6dac20" />
      <path d="M 0 0 L 0 12 M -4 8 L 0 12 L 4 8" fill="none" stroke="#6dac20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Flanking Right Symbol: Palette / Design Icons -->
    <g transform="translate(400, 175)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <path d="M 0 -11 C -7 -11 -12 -6 -12 0 C -12 6 -7 11 0 11 C 3 11 5 9 5 7 C 5 5 4 4 6 4 L 8 4 C 10.5 4 12 2 12 0 C 12 -6 7 -11 0 -11 Z" fill="#6dac20" />
      <circle cx="-5" cy="-4" r="2" fill="#ffffff" />
      <circle cx="2" cy="-6" r="2" fill="#ffffff" />
      <circle cx="-6" cy="3" r="2" fill="#ffffff" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Loxone Icons</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
